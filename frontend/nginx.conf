server {
    # Must match the container port mapped in docker-compose.yml.
    listen 3001;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vue Router runs in history mode, so any unknown path has to fall back to
    # index.html. Without this, refreshing /login or /discover returns a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so they are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
