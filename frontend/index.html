<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MyQuizz</title>
    <!-- logo.png is the single brand asset, so both the favicon and the iOS icon use it. -->
    <link rel="icon" type="image/png" sizes="16x16 32x32 192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="theme-color" content="#6c4cf1" />
    <meta
      name="description"
      content="MyQuizz - create quizzes, play together and follow results in real time."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Design v2.1 "Daylight Studio" ships exactly two families: Instrument Sans for
      every piece of text, Martian Mono for every number. Both are variable fonts.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400..700&family=Martian+Mono:wght@300..600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
