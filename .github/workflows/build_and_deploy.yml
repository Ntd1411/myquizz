name: Build and Deploy to VPS

on:
  push:
    branches:
      - main
  # Allows re-running a deploy from the Actions tab without pushing a commit.
  workflow_dispatch:

# Never let two deploys touch the server at the same time. A queued deploy waits
# for the running one instead of interleaving git pull, build and pm2 reload.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build-backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./backend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./backend
        run: pnpm lint

      - name: Build
        working-directory: ./backend
        run: pnpm build

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ./frontend
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: ./frontend
        run: pnpm lint

      - name: Build
        working-directory: ./frontend
        run: pnpm build

  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}

    steps:
      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Add VPS to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      # Invoked through bash on purpose: the deploy still works even if the
      # executable bit on deploy.sh is missing on the server.
      - name: Deploy to VPS
        run: |
          ssh "$VPS_USER@$VPS_HOST" "cd '$VPS_DEPLOY_PATH' && bash deploy.sh"

      - name: Verify service health
        run: |
          ssh "$VPS_USER@$VPS_HOST" bash -s << 'ENDSSH'
          set -euo pipefail
          # Give pm2 a moment to finish reloading before probing.
          sleep 5
          echo "--- pm2 status ---"
          pm2 list
          echo "--- health check ---"
          curl -fsS http://127.0.0.1:3000/health
          ENDSSH
